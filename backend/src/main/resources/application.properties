spring.application.name=fertilizer-ai-agent

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Flyway database migrations
spring.flyway.enabled=true

# Facebook webhook
facebook.app-secret=${FB_APP_SECRET:}
facebook.verify-token=${FB_VERIFY_TOKEN:}

# LLM (Gemini, giao thức tương thích OpenAI)
llm.base-url=${LLM_BASE_URL:}
llm.api-key=${LLM_API_KEY:}
llm.model=${LLM_MODEL:gemini-3.1-flash-lite}
llm.fallback-model=${LLM_FALLBACK_MODEL:}
llm.timeout-seconds=20

# Tài khoản Basic Auth tạm thời; để trống mật khẩu thì Spring tự sinh (xem log)
spring.security.user.name=admin
spring.security.user.password=${APP_ADMIN_PASSWORD:}
